name: Glimmer
options:
  bundleIdPrefix: com.brattoo
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: V783A2L763
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    GLIMMER_FEED_URL: "https://glimmer.brattoo.com/appcast.xml"
    SWIFT_EMIT_LOC_STRINGS: YES

# Features a build can leave out (Config/Features.xcconfig); debug builds have them all.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  GlimmerKit:
    path: Packages/GlimmerKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # One version, and Config/Package.resolved pins its revision: a build never picks up a newer Sparkle by itself.
    # To move to another version: Anders's yes to the fetch, then change both (scripts/packages-offline.sh).
    exactVersion: 2.10.1

targets:
  Glimmer:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: GlimmerKit
        product: GlimmerCore
      - package: GlimmerKit
        product: GlimmerRender
      - package: GlimmerKit
        product: GlimmerTools
      - package: GlimmerKit
        product: GlimmerAI
      - package: GlimmerKit
        product: GlimmerHeal
      - package: Sparkle
      - target: GlimmerThumbnail
        embed: true
      - target: GlimmerPreview
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer
        PRODUCT_NAME: Glimmer
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_PUBLIC_KEY: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(GLIMMER_FEATURE_CONDITIONS)
      configs:
        # Debug builds are a separate app (own container, settings, saved windows and keychain
        # item), so tests never touch the real Glimmer; release.sh builds Release only.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer.debug
    entitlements:
      path: App/Glimmer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The local agent API (127.0.0.1 only, see AgentServer).
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        # A file a sibling app (or the person) handed over stays linked across a restart: a sandboxed app
        # can only write it again after a relaunch through a bookmark it kept (decided by Anders 2026-11-16,
        # docs/RELEASE.md point 9). It must stand HERE: XcodeGen writes App/Glimmer.entitlements from this
        # list, and a key added only to that file is gone at the next `xcodegen generate` (it was, until the
        # update rehearsal of 2026-11-16 read the signed app's entitlements).
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle's installer XPC services in a sandboxed app.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Glimmer
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "© 2026 Brattoo AB"
        # Updates (Sparkle). The updater stays off until SUPublicEDKey is set by scripts/release.sh.
        # The feed is a build setting, so that a rehearsal build carries the local feed from the moment it is built
        # (scripts/release.sh --dry-run and --notarize-only): no copy that would ask the real feed lies on disk before a release.
        SUFeedURL: $(GLIMMER_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Glimmer Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.brattoo.glimmer.document
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: Glimmer for the Web Project
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.brattoo.glimmer.aips
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.brattoo.glimmer.aips
            UTTypeDescription: Glimmer for the Web Project
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - aips
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.brattoo.glimmer.document
            UTTypeDescription: Glimmer Document
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - glimmer

  GlimmerThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook/Thumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer.thumbnail
        PRODUCT_NAME: GlimmerThumbnail
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer.debug.thumbnail
    entitlements:
      path: QuickLook/Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Thumbnail/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Glimmer Thumbnails
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.brattoo.glimmer.document
            QLThumbnailMinimumDimension: 16

  GlimmerPreview:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook/Preview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer.preview
        PRODUCT_NAME: GlimmerPreview
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer.debug.preview
    entitlements:
      path: QuickLook/Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Preview/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Glimmer Previews
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.brattoo.glimmer.document
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false

  GlimmerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Glimmer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.glimmer.uitests
        TEST_TARGET_NAME: Glimmer
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GlimmerUITests:
    build:
      targets:
        Glimmer: all
        GlimmerUITests: [test]
    test:
      targets:
        - GlimmerUITests
  Glimmer:
    build:
      targets:
        Glimmer: all
    run:
      config: Debug
    test:
      targets:
        - package: GlimmerKit/GlimmerCoreTests
        - package: GlimmerKit/GlimmerRenderTests
        - package: GlimmerKit/GlimmerAITests
