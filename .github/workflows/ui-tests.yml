name: UI tests
# Started by hand only (Actions › UI tests › Run workflow, or `gh workflow run "UI tests"`):
# these drive the real app with the mouse and keyboard on the self-hosted Mac for about a
# minute, so nobody should be using it meanwhile.
on:
  workflow_dispatch:
jobs:
  ui:
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: UI tests
        shell: zsh {0}
        run: |
          # The background service can't reach the signing key in the login keychain, so sign ad hoc.
          if scripts/uitest.sh CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= > uitest.log 2>&1; then
            grep -E "Test Case|Executed" uitest.log
          else
            grep -E "Test Case|error:|Executed|Testing failed" -A3 uitest.log | tail -40
            echo "---"; tail -25 uitest.log
            exit 1
          fi
