name: CI
# Manual for now: the app targets macOS 27, and GitHub's hosted runners stop at macOS 26
# (a job asking for macos-27 just waits in the queue). When a macOS 27 runner exists, or a
# self-hosted Mac is registered with that label, switch this back to push and pull_request.
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Package tests
        run: swift test --package-path Packages/GlimmerKit
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Glimmer.xcodeproj -scheme Glimmer -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData build -quiet \
            CODE_SIGNING_ALLOWED=NO
