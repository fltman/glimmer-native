name: CI
# Runs on a self-hosted Mac with macOS 27 (GitHub's hosted machines stop at macOS 26).
# Register one with scripts/setup-runner.sh; until then, jobs wait in the queue.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Package tests
        run: swift test --package-path Packages/GlimmerKit
      - name: Build the app
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Glimmer.xcodeproj -scheme Glimmer -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData build -quiet \
            CODE_SIGNING_ALLOWED=NO
